{% extends "base.html" %}
{% block заголовок %}Вход — CodeHogwarts{% endblock %}
{% block содержимое %}
<div class="обёртка узкая" style="padding:44px 0">
  <div class="карта">
    <h2 style="margin-top:0">С возвращением</h2>
    {% if ошибка %}<div class="ошибка">{{ ошибка }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="email">Почта или логин</label>
      <input id="email" name="email" type="text" required autocomplete="username">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="кнопка большая" type="submit" style="width:100%">Войти</button>
    </form>
    <p class="тише центр" style="margin-bottom:0">Ещё нет аккаунта? <a href="/test">Пройти тест</a></p>
  </div>
</div>
{% endblock %}
